name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Config into HTML
        run: |
          CONFIG_SCRIPT="<script>window.ENV_CONFIG = { \"supabaseUrl\": \"${{ secrets.SUPABASE_URL }}\", \"supabaseKey\": \"${{ secrets.SUPABASE_KEY }}\" };</script>"
          sed -i "s|<!-- CONFIG_INJECTION_MARKER -->|$CONFIG_SCRIPT|g" monitor.html

      - name: Verify Injection
        run: grep "window.ENV_CONFIG" monitor.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
