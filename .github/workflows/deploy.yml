name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Config into HTML
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          CONFIG_SCRIPT="<script>window.ENV_CONFIG = { \"supabaseUrl\": \"${{ secrets.SUPABASE_URL }}\", \"supabaseKey\": \"${{ secrets.SUPABASE_KEY }}\" }; console.log('ENV_CONFIG injected successfully.');</script>"
          # Prepend to the very first line of monitor.html
          sed -i "1s|^|$CONFIG_SCRIPT\n|" monitor.html
          
          echo "=== VERIFICATION ==="
          head -n 5 monitor.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
