name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Config File
        run: |
          echo "{" > env-config.json
          echo "  \"supabaseUrl\": \"${{ secrets.SUPABASE_URL }}\"," >> env-config.json
          echo "  \"supabaseKey\": \"${{ secrets.SUPABASE_KEY }}\"," >> env-config.json
          echo "  \"monitorPassword\": \"${{ secrets.MONITOR_PASSWORD }}\"" >> env-config.json
          echo "}" >> env-config.json

      - name: Verify File Existence
        run: ls -la env-config.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
