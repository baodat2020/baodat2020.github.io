name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Config into HTML
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "=== BEFORE INJECTION ==="
          grep -C 2 "MARKER" monitor.html || echo "Marker not found in first 100 lines."
          
          python3 -c "import os, re; p='monitor.html'; c=open(p).read(); m=r'<!--\s*CONFIG_INJECTION_MARKER\s*-->'; r='<script>window.ENV_CONFIG = { \"supabaseUrl\": \"' + os.environ.get('SUPABASE_URL','') + '\", \"supabaseKey\": \"' + os.environ.get('SUPABASE_KEY','') + '\" };</script>'; open(p,'w').write(re.sub(m,r,c))"
          
          echo "=== AFTER INJECTION ==="
          grep -C 2 "window.ENV_CONFIG" monitor.html || echo "Injection failed to manifest in file."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
